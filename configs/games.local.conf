<VirtualHost *:80>
    ServerName games.local
    DocumentRoot /var/www/games

    <Directory /var/www/games>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/games-error.log
    CustomLog ${APACHE_LOG_DIR}/games-access.log combined
</VirtualHost>
