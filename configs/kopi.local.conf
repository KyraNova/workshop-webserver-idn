<VirtualHost *:80>
    ServerName kopi.local
    DocumentRoot /var/www/kopi

    <Directory /var/www/kopi>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/kopi-error.log
    CustomLog ${APACHE_LOG_DIR}/kopi-access.log combined
</VirtualHost>
